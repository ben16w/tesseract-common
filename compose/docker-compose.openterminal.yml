---

services:
  openterminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: openterminal
    restart: always
    ports:
      - "8001:8000"
    environment:
      OPEN_TERMINAL_MULTI_USER: "true"
      OPEN_TERMINAL_API_KEY: "${TESSERACT_OPENTERMINAL_API_KEY}"
    volumes:
      - openterminal_data:/home

volumes:
  openterminal_data:

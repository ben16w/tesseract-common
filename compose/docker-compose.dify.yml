---

services:
  dify_api:
    image: langgenius/dify-api:1.17.1
    container_name: dify_api
    restart: always
    depends_on:
      dify_db:
        condition: service_started
      dify_redis:
        condition: service_started
      dify_weaviate:
        condition: service_started
      dify_plugin_daemon:
        condition: service_started
      dify_sandbox:
        condition: service_started
    ports:
      - "5001:5001"
    environment:
      MODE: api
      MIGRATION_ENABLED: "true"
      SERVER_WORKER_AMOUNT: 2
      SERVER_WORKER_CONNECTIONS: 50
      SECRET_KEY: ${TESSERACT_DIFY_KEY}
      VECTOR_STORE: weaviate
      DB_HOST: dify_db
      DB_USERNAME: dify
      DB_PASSWORD: "${TESSERACT_SQL_PASSWORD}"
      REDIS_HOST: dify_redis
      CELERY_BROKER_URL: redis://dify_redis:6379/1
      WEAVIATE_ENDPOINT: http://dify_weaviate:8080
      WEAVIATE_GRPC_ENDPOINT: grpc://dify_weaviate:50051
      WEAVIATE_API_KEY: ${TESSERACT_DIFY_KEY}
      PLUGIN_DAEMON_URL: http://dify_plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${TESSERACT_DIFY_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${TESSERACT_DIFY_KEY}
      CODE_EXECUTION_ENDPOINT: http://dify_sandbox:8194
      CODE_EXECUTION_API_KEY: ${TESSERACT_DIFY_KEY}
      APP_WEB_URL: "https://dify.${TESSERACT_DOMAIN}"
      CONSOLE_API_URL: "https://dify-api.${TESSERACT_DOMAIN}"
      CONSOLE_WEB_URL: "https://dify.${TESSERACT_DOMAIN}"
      COOKIE_DOMAIN: ".${TESSERACT_DOMAIN}"
      CONSOLE_CORS_ALLOW_ORIGINS: "https://dify.${TESSERACT_DOMAIN}"
      WEB_API_CORS_ALLOW_ORIGINS: "https://dify.${TESSERACT_DOMAIN}"
    volumes:
      - "${TESSERACT_APPDATA_PATH}/dify_storage:/app/api/storage"

  dify_worker:
    image: langgenius/dify-api:1.17.1
    container_name: dify_worker
    restart: always
    depends_on:
      dify_db:
        condition: service_started
      dify_sandbox:
        condition: service_started
      dify_plugin_daemon:
        condition: service_started
      dify_redis:
        condition: service_started
      dify_weaviate:
        condition: service_started
    environment:
      MODE: worker
      MIGRATION_ENABLED: "true"
      SERVER_WORKER_AMOUNT: 2
      SERVER_WORKER_CONNECTIONS: 50
      SECRET_KEY: ${TESSERACT_DIFY_KEY}
      VECTOR_STORE: weaviate
      DB_HOST: dify_db
      DB_USERNAME: dify
      DB_PASSWORD: "${TESSERACT_SQL_PASSWORD}"
      REDIS_HOST: dify_redis
      CELERY_BROKER_URL: redis://dify_redis:6379/1
      WEAVIATE_ENDPOINT: http://dify_weaviate:8080
      WEAVIATE_GRPC_ENDPOINT: grpc://dify_weaviate:50051
      WEAVIATE_API_KEY: ${TESSERACT_DIFY_KEY}
      PLUGIN_DAEMON_URL: http://dify_plugin_daemon:5002
      PLUGIN_DAEMON_KEY: ${TESSERACT_DIFY_KEY}
      INNER_API_KEY_FOR_PLUGIN: ${TESSERACT_DIFY_KEY}
      CODE_EXECUTION_ENDPOINT: http://dify_sandbox:8194
      CODE_EXECUTION_API_KEY: ${TESSERACT_DIFY_KEY}
    volumes:
      - "${TESSERACT_APPDATA_PATH}/dify_storage:/app/api/storage"

  dify_worker_beat:
    image: langgenius/dify-api:1.17.1
    container_name: dify_worker_beat
    restart: always
    depends_on:
      dify_db:
        condition: service_started
      dify_redis:
        condition: service_started
    environment:
      MODE: beat
      MIGRATION_ENABLED: "true"
      SECRET_KEY: ${TESSERACT_DIFY_KEY}
      VECTOR_STORE: weaviate
      DB_HOST: dify_db
      DB_USERNAME: dify
      DB_PASSWORD: "${TESSERACT_SQL_PASSWORD}"
      REDIS_HOST: dify_redis
      CELERY_BROKER_URL: redis://dify_redis:6379/1

  dify_plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    container_name: dify_plugin_daemon
    restart: always
    depends_on:
      dify_db:
        condition: service_started
      dify_redis:
        condition: service_started
    environment:
      DB_TYPE: postgresql
      DB_HOST: dify_db
      DB_PORT: 5432
      DB_USERNAME: dify
      DB_PASSWORD: "${TESSERACT_SQL_PASSWORD}"
      DB_DATABASE: dify_plugin
      REDIS_HOST: dify_redis
      REDIS_PORT: 6379
      SERVER_PORT: 5002
      SERVER_KEY: ${TESSERACT_DIFY_KEY}
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/storage/cwd
      DIFY_INNER_API_URL: http://dify_api:5001
      DIFY_INNER_API_KEY: ${TESSERACT_DIFY_KEY}
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
    volumes:
      - "${TESSERACT_APPDATA_PATH}/dify_plugin:/app/storage"

  dify_sandbox:
    image: langgenius/dify-sandbox:0.2.15
    container_name: dify_sandbox
    restart: always
    environment:
      API_KEY: ${TESSERACT_DIFY_KEY}
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: "true"
      SANDBOX_PORT: 8194

  dify_web:
    image: langgenius/dify-web:1.17.1
    container_name: dify_web
    restart: always
    depends_on:
      - dify_api
    ports:
      - "3010:3000"
    environment:
      CONSOLE_API_URL: "https://dify-api.${TESSERACT_DOMAIN}"
      APP_API_URL: "https://dify-api.${TESSERACT_DOMAIN}"
      SERVER_CONSOLE_API_URL: http://dify_api:5001
      SERVER_APP_API_URL: http://dify_api:5001
      NEXT_PUBLIC_COOKIE_DOMAIN: ".${TESSERACT_DOMAIN}"
      NEXT_TELEMETRY_DISABLED: "1"

  dify_telegram_bridge:
    build:
      context: ../dockerfiles/dify-telegram-bridge
    container_name: dify_telegram_bridge
    restart: always
    depends_on:
      dify_api:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: "${TESSERACT_TELEGRAM_BOT_TOKEN}"
      TELEGRAM_ALLOWED_USER_IDS: "${TESSERACT_TELEGRAM_ALLOWED_USER_IDS:-}"
      DIFY_APP_API_KEY: "${TESSERACT_DIFY_APP_API_KEY}"
      DIFY_API_URL: "http://dify_api:5001/v1"
    volumes:
      - "${TESSERACT_APPDATA_PATH}/dify_telegram_bridge:/data"

  dify_db:
    image: postgres:15-alpine
    container_name: dify_db
    restart: always
    environment:
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: "${TESSERACT_SQL_PASSWORD}"
      POSTGRES_DB: dify
    volumes:
      - "${TESSERACT_APPDATA_PATH}/dify_postgres:/var/lib/postgresql/data"

  dify_redis:
    image: redis:6-alpine
    container_name: dify_redis
    restart: always
    volumes:
      - "${TESSERACT_APPDATA_PATH}/dify_redis:/data"

  dify_weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2
    container_name: dify_weaviate
    restart: always
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${TESSERACT_DIFY_KEY}
      AUTHENTICATION_APIKEY_USERS: "dify"
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: "dify"
    volumes:
      - "${TESSERACT_APPDATA_PATH}/dify_weaviate:/var/lib/weaviate"
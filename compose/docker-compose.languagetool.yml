---

services:
  languagetool:
    build:
      context: ../dockerfiles
      dockerfile: Dockerfile.languagetool
      args:
        NGRAMS_FILE: "ngrams-en-20150817.zip"
    container_name: languagetool
    restart: always
    ports:
      - 8010:8010
    environment:
      - Java_Xms=256m
      - Java_Xmx=512m

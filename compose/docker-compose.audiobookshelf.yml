---

services:
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: always
    environment:
      AUDIOBOOKSHELF_UID: ${TESSERACT_UID}
      AUDIOBOOKSHELF_GID: ${TESSERACT_UID}
    volumes:
      - "${TESSERACT_APPDATA_PATH}/audiobookshelf_config:/config"
      - "${TESSERACT_APPDATA_PATH}/audiobookshelf_metadata:/metadata"
      - "${TESSERACT_DATA_PATH}/Audio/Audiobooks:/audiobooks"
      - "${TESSERACT_DATA_PATH}/Audio/Podcasts:/podcasts"

  audiobookshelf_theme:
    container_name: audiobookshelf_theme
    image: ghcr.io/rodzalendo/nanohive-abs-theme:latest
    restart: always
    ports:
      - 13378:80
    depends_on:
      - audiobookshelf
    environment:
      ABS_UPSTREAM: http://audiobookshelf:80
    volumes:
      - "${TESSERACT_APPDATA_PATH}/audiobookshelf_theme:/data/nh"

# Dante SOCKS5 proxy; outbound via VPN tun0.
logoutput: stderr

internal: 0.0.0.0 port = 1080
external: tun0

socksmethod: none
clientmethod: none

user.privileged: root
user.unprivileged: nobody

client pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  log: error
}

socks pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  command: bind connect udpassociate
  log: error
}

socks pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  command: bindreply udpreply
  log: error
}
